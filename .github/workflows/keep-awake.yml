# Keeps khapee.com's server awake.
#
# Render's free plan puts the server to sleep after 15 minutes without a
# visitor, and the first customer after that waits up to a minute for it to
# wake. A request every 10 minutes means it never falls asleep. Runs on
# GitHub's own free scheduler — no extra service or account.
#
# One always-on server uses about 744 of the 750 free hours Render gives each
# month, so this must stay the only free web service kept awake.
name: Keep khapee.com awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health check
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 https://khapee.com/api/health; then exit 0; fi
            sleep 20
          done
          echo "khapee.com did not answer after 3 tries"
          exit 1

      # Supabase pauses a free project after a week without activity, and the
      # database backup lives there — a paused bucket would stop the app from
      # restoring on its next start. Fetching one tiny public file counts.
      - name: Keep the Supabase backup project active
        if: ${{ vars.SUPABASE_PING_URL != '' }}
        run: curl -fsS --max-time 30 -o /dev/null "${{ vars.SUPABASE_PING_URL }}"
