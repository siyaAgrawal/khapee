<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- One tag, rewritten by the theme switch. It carries the page's own top
         colour — the header bar, not the purple block under it — because the
         browser's chrome sits directly above that bar and nothing else. -->
    <meta name="theme-color" content="#f7f6f3" />
    <title>Khapee — order at the table</title>

    <script>
      /*
        Set the theme before the first pixel.

        React mounting a moment later and adding the attribute then is a white
        flash for anybody who chose dark, which is worse than either theme.
        The phone's own preference is deliberately not read: a menu is looked
        at in a lit restaurant more often than in bed, so light is the default
        for everybody and dark is something you pick.
      */
      ;(function () {
        try {
          if (localStorage.getItem('khapee.theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#0e0e0d')
          }
        } catch (e) {
          /* a private window simply gets the light theme */
        }
      })()
    </script>

    <!--
      Inter sets everything, and Archivo sets the one line that shouts.

      The app used to be Space Grotesk over Bricolage Grotesque — two faces
      with a lot of personality in the letterforms themselves, which is
      wonderful on a poster and tiring on a menu you read for twenty minutes.
      Every app people actually order food from uses a plain, wide-aperture
      sans and spends its personality on colour, photographs and one big
      headline instead. Inter is that plain face. Archivo is the brand's
      own: upright at 900 for the wordmark, italic at 900 for the one line
      that shouts at the top of the home screen.

      preconnect first so the first paint is not waiting on a DNS lookup, and
      display=swap so a slow font never leaves a customer looking at a blank
      menu.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,800;0,900;1,800;1,900&family=Inter:wght@400;500;600;700;800;900&display=swap"
    />

    <!-- Added to the home screen, this opens as its own app: no browser bars,
         its own icon, and the shell cached so it appears at once even while the
         server is still waking. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Khapee" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /**
       * Catch the install offer before the app exists.
       *
       * Chrome raises beforeinstallprompt as soon as it decides a site is
       * installable, which is routinely before React has mounted and attached
       * its listener — and the event fires once. Miss it and there is no way
       * to ask for it again: the page simply believes the browser cannot
       * install, which is what the dashboard was telling a Windows machine
       * running Chrome. Parked here, where nothing has to have loaded yet.
       */
      window.__khapeeInstall = null
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault()
        window.__khapeeInstall = e
        window.dispatchEvent(new Event('khapee:installable'))
      })
      window.addEventListener('appinstalled', function () {
        window.__khapeeInstall = null
      })
    </script>
    <script>
      // Keep the app up to date on its own.
      //
      // A phone that has Khapee installed will otherwise sit on the copy it
      // first downloaded: the worker script is read from the browser's own
      // cache, so a new one is never noticed, and the page it controls keeps
      // loading the build it was made against. The effect is a feature that
      // shipped days ago being invisible on exactly the device it was meant
      // for, with nothing anywhere to explain it.
      //
      // updateViaCache: 'none' makes the browser fetch the worker itself
      // rather than remember it; the check on load and on returning to the tab
      // catches a deploy that happened while the app was closed; and reloading
      // once when a new worker takes over is what actually puts the new code on
      // screen without anybody being told to clear anything.
      if ('serviceWorker' in navigator) {
        addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { updateViaCache: 'none' })
            .then((reg) => {
              reg.update().catch(() => {})
              addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') reg.update().catch(() => {})
              })
            })
            .catch(() => {})

          // Only when one worker replaces another. On a first visit there is
          // no controller and this fires anyway, which would reload the page
          // out from under somebody who had just arrived.
          var hadOne = !!navigator.serviceWorker.controller
          var reloading = false
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!hadOne || reloading) return
            reloading = true
            location.reload()
          })
        })
      }
    </script>
  </body>
</html>
