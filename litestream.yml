# Continuous backup of Khapee's database to S3-compatible storage — Supabase
# Storage or Backblaze B2, both free with no card.
# Used only when BACKUP_BUCKET is set — see scripts/start.sh. Every value comes
# from the environment, so no key is ever in this repository.
dbs:
  - path: ${KHAPEE_DB}
    replica:
      type: s3
      bucket: ${BACKUP_BUCKET}
      path: khapee
      endpoint: ${BACKUP_ENDPOINT}
      region: ${BACKUP_REGION}
      access-key-id: ${BACKUP_KEY_ID}
      secret-access-key: ${BACKUP_SECRET}
      force-path-style: true
      # Copy changes to the bucket every second.
      sync-interval: 1s
