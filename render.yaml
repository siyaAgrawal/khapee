# Render blueprint: one Node process serving the API and the built app.
#
# One process means one database, which is the whole point: a code generated at
# the counter reaches the customer's phone, on any network. Vercel cannot do
# that — each of its serverless functions has a private copy. See DEPLOY.md.
#
# This is the FREE instance type, which needs no card. Free services have no
# disk and sleep after ~15 minutes idle (waking takes up to a minute); on wake
# the database is rebuilt from the committed snapshot, so restaurants, menus and
# photos come back, but orders and codes made in between do not.
#
# For a real restaurant, change `plan` to starter and uncomment the two blocks
# at the bottom. Nothing else changes.
services:
  - type: web
    name: ordro
    runtime: node
    plan: free

    # --include=dev is not optional. The build needs vite and the TypeScript
    # toolchain, which are devDependencies, and a host that has NODE_ENV set to
    # production would otherwise skip them and fail with "vite: not found".
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health

    # The app's own domain. Render provisions the certificate once the DNS below
    # points here; until then the onrender.com address keeps working, and after
    # it does both do. Nothing in the app hardcodes either — QR codes and share
    # links are built from whichever host the request came in on.
    domains:
      - khapee.com
      - www.khapee.com

    envVars:
      # NODE_ENV is deliberately NOT set here. Render applies env vars to the
      # build as well as the run, and NODE_ENV=production makes npm drop the
      # devDependencies the build itself needs. `npm start` already sets it for
      # the server, which is the only place it matters.
      #
      # The container's filesystem starts empty, so seed the catalogue and its
      # photos from the committed snapshot on boot. Without this the app comes
      # up with no restaurants at all.
      - key: ORDRO_SEED
        value: snapshot

      # Signs login tokens. Render generates it once and keeps it across
      # deploys and restarts, which is the whole point: the container has no
      # disk, so the database — and with it the sessions table — is rebuilt
      # from the snapshot every time the service wakes. A key that outlives
      # that is what stops everyone being signed out each time the site sleeps.
      # Changing it signs everybody out.
      - key: KHAPEE_SECRET
        generateValue: true

      # --- Order alerts (optional; add these in the Render dashboard) --------
      #
      # Both are off unless set, and the app runs exactly as before without
      # them. Add them under Environment on the service, not here, so the
      # private values never enter the repository.
      #
      # Push notifications need nothing set: the keypair is worked out from
      # KHAPEE_SECRET above, which Render generates once and keeps across every
      # deploy, so it is the same pair on every boot — which is the one thing
      # push requires. Override it only to move to a key of your own:
      #
      #   VAPID_PUBLIC    the public half
      #   VAPID_PRIVATE   the private half
      #   VAPID_SUBJECT   mailto: address, optional
      #
      # Note that changing KHAPEE_SECRET changes the derived pair, which
      # unsubscribes every device — the same deploy already signs everybody out.
      #
      # Order emails over plain SMTP. Gmail relays these free for a normal
      # account with an app password (Google Account → Security → App
      # passwords, which needs 2-step verification on first).
      #
      #   SMTP_HOST       smtp.gmail.com
      #   SMTP_PORT       465
      #   SMTP_USER       the full Gmail address
      #   SMTP_PASS       the 16-character app password

    # --- Paid upgrade: persistent data ---------------------------------------
    # Set plan: starter above, then uncomment both of these.
    #
    #   envVars:
    #     - key: TABLO_DB
    #       value: /var/data/ordro.db
    #
    # disk:
    #   name: ordro-data
    #   mountPath: /var/data
    #   sizeGB: 1
