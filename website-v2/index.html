    <!--
      Bricolage for the headlines, Space Grotesk underneath.

      Bricolage is a grotesque with deliberate irregularity in the
      letterforms — slightly off in the way a person draws and a machine does
      not — which is exactly what a page like this needs to stop reading as
      generated. Archivo was tried in between and was correct and dull.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
