<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khapee — you don't wait. Your food does.</title>
    <meta name="description" content="Order before you arrive. Pay before you arrive. Your food is ready when you get there." />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="Khapee — order before you arrive" />
    <meta property="og:description" content="You arrive. Your food is already waiting." />
    <!--
      The same two faces as the app, so the site and the thing it is
      advertising are one brand.

      This was Bricolage over Space Grotesk, which is a good pairing for a
      poster and was the reason the app looked hand-made in the wrong way.
      Inter sets everything; Archivo appears at 900 italic on the cover line
      and nowhere else.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,800;1,900&family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      /*
        Set the theme before the first pixel.

        React mounting a moment later and adding the attribute then is a white
        flash on a dark page, which is worse than either theme. Light is the
        default and the system preference is deliberately not consulted: this
        is a shop front, it opens in daylight, and the dark version is
        something you choose.
      */
      ;(function () {
        try {
          var saved = localStorage.getItem('khapee.theme')
          if (saved === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark')
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#0c0716')
          }
        } catch (e) {
          /* a private window simply gets the light theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
